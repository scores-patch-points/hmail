<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hyphae — people</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #1b1d28; color: #b1a6d4; font: 300 14px/1.55 "Helvetica Neue", system-ui, sans-serif; }
      main { max-width: 600px; margin: 36px auto; padding: 0 20px; }
      .word { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; }
      h1 { font-weight: 400; font-size: 21px; margin: 8px 0 2px; color: #cfc8ec; }
      p.sub { margin: 0 0 20px; color: #8a8a9c; font-size: 13px; }
      .card { border: 1px solid #313140; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; background: #20222f; }
      h2 { font: 400 14px/1.3 inherit; color: #cfc8ec; margin: 0 0 8px; }
      label { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #8a8a9c; margin: 10px 0 4px; }
      input, textarea { width: 100%; box-sizing: border-box; font: inherit; color: #e8e4fb; background: #171925; border: 1px solid #313140; border-radius: 10px; padding: 8px 10px; outline: none; }
      textarea { min-height: 90px; font: 12px/1.45 ui-monospace, Menlo, monospace; }
      input:focus, textarea:focus { border-color: #938bb2; }
      button { font: inherit; font-size: 12px; border: 1px solid #938bb2; background: transparent; color: #b1a6d4; border-radius: 999px; padding: 6px 14px; cursor: pointer; margin-top: 10px; margin-right: 6px; }
      button.p { background: #938bb2; color: #1b1d28; }
      .out { margin-top: 12px; padding: 10px 12px; border: 1px solid #313140; border-radius: 10px; background: #171925; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #cfc8ec; }
      .code { font-size: 20px; letter-spacing: .18em; color: #e8e4fb; }
      .warn { color: #e0a96d; }
      .ok { color: #9fcfae; }
      .who { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid #313140; font-size: 13px; }
      .who:first-child { border-top: 0; }
      .dim { color: #8a8a9c; }
      .hide { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="word">hyphae</div>
      <h1>People</h1>
      <p class="sub">Connect with someone so you can seal to each other. The invitation travels by any channel; the code goes by a different one.</p>

      <div class="card">
        <h2>Invite someone</h2>
        <label for="inv-to">Their email address</label>
        <input id="inv-to" type="email" />
        <button class="p" id="inv-go">Create invitation</button>
        <div id="inv-out" class="hide">
          <label>1 · Send this message (email, Element, anything)</label>
          <div class="out" id="inv-body"></div>
          <button id="inv-copy">Copy message</button>
          <label>2 · Tell them this code by a different channel (Signal, in person)</label>
          <div class="out code" id="inv-code"></div>
        </div>
      </div>

      <div class="card">
        <h2>Got something from someone?</h2>
        <div class="dim">Paste an invitation, a hello or a welcome. hyphae works out which it is.</div>
        <textarea id="acc-text" placeholder="paste here"></textarea>
        <div id="acc-codewrap" class="hide"><label for="acc-code">The code they gave you</label><input id="acc-code" autocomplete="off" /></div>
        <button class="p" id="acc-go">Continue</button>
        <div id="acc-out" class="out hide"></div>
        <button id="acc-copy" class="hide">Copy reply</button>
      </div>

      <div class="card">
        <h2>Your people</h2>
        <div id="who" class="dim">Nobody yet.</div>
      </div>
    </main>
    <script src="people.js"></script>
  </body>
</html>
