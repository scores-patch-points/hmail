<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyphae</title>
    <style>
      :root { color-scheme: light dark; }
      body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      h1 { font: 600 15px/1.2 Georgia, serif; margin: 0 0 2px; }
      p.sub { margin: 0 0 12px; color: GrayText; font-size: 12px; }
      label { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: GrayText; margin: 10px 0 4px; }
      select, input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
      .row { display: flex; gap: 6px; margin-top: 8px; }
      button { flex: 1; padding: 7px 8px; font: inherit; cursor: pointer; }
      button.primary { font-weight: 600; }
      #status { margin-top: 10px; min-height: 2.6em; font-size: 12px; }
      #status.err { color: #b91c1c; }
      #status.ok { color: #15803d; }
      details { margin-top: 12px; }
      summary { cursor: pointer; font-size: 12px; color: GrayText; }
      textarea { width: 100%; box-sizing: border-box; font: 11px/1.3 ui-monospace, Menlo, monospace; min-height: 54px; }
    </style>
  </head>
  <body>
    <h1>Hyphae</h1>
    <p class="sub">Seal what you write, on any site.</p>

    <label for="circle">Circle</label>
    <select id="circle"></select>

    <div class="row">
      <button id="seal" class="primary" title="Alt+Shift+S">Seal field</button>
      <button id="reveal" title="Alt+Shift+R">Reveal page</button>
    </div>
    <div id="status" role="status"></div>

    <details>
      <summary>Circles &amp; keys</summary>
      <label for="newName">New circle</label>
      <div class="row">
        <input id="newName" type="text" placeholder="e.g. family" />
        <button id="create" style="flex:0 0 auto">Create</button>
      </div>
      <label for="share">Share this circle's key</label>
      <textarea id="share" readonly placeholder="Select a circle"></textarea>
      <div class="row"><button id="copy">Copy key</button></div>
      <label for="import">Join a circle</label>
      <textarea id="import" placeholder="Paste a hy1key… string"></textarea>
      <div class="row"><button id="doImport">Join</button></div>
    </details>

    <script src="crypto.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
